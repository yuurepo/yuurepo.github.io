<style>
  :root{
    --bg: #EEF2F7;
    --surface: #FFFFFF;
    --ink: #10141B;
    --text: #12151C;
    --text-soft: #626E7E;
    --line: rgba(16,20,27,0.09);
    --accent: #32475F;
    --ice: #A9BED4;
    --max: 960px;
    --r: 6px;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }

  .glow{
    position: fixed;
    pointer-events: none;
    z-index: -1;
    filter: blur(70px);
    opacity: .55;
  }
  .glow.g1{ top:-160px; left:-120px; width:520px; height:420px;
    background: radial-gradient(circle, rgba(50,71,95,0.55), transparent 65%); }
  .glow.g2{ top:280px; right:-180px; width:480px; height:420px;
    background: radial-gradient(circle, rgba(34,80,95,0.4), transparent 65%); }

  a { color: inherit; }
  ::selection { background: var(--accent); color: #fff; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .serif{ font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400; }

  .wrap{ max-width: var(--max); margin: 0 auto; padding: 0 32px; position: relative; }

  /* ---------- Nav ---------- */
  header{ padding: 32px 0 0; }
  nav{
    display:flex; justify-content: space-between; align-items: center;
    padding-bottom: 20px; border-bottom: 1px solid var(--line);
  }
  .brand{ font-size: 21px; letter-spacing: 0.2px; text-decoration:none; }
  .navlinks{ display:flex; gap: 30px; font-size: 14px; color: var(--text-soft); }
  .navlinks a{ text-decoration:none; transition: color .15s ease; }
  .navlinks a:hover{ color: var(--text); }

  /* ---------- Profile ---------- */
  .profile{
    display:flex; align-items:center; gap: 30px;
    padding: 72px 0 40px;
  }
  .avatar{
    flex: none;
    width: 104px; height: 104px;
    border-radius: 50%;
    background: linear-gradient(155deg,#2E4157,#4F7B93);
    display:flex; align-items:center; justify-content:center;
    color:#EEF3F8; font-size: 42px;
    box-shadow: 0 20px 34px -18px rgba(16,20,27,0.5);
    overflow: hidden;
    position: relative;
  }
  .avatar img{
    position: absolute; inset: 0;
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .profile h1{ font-size: 28px; margin: 0 0 8px; }
  .profile .bio{ color: var(--text-soft); max-width: 50ch; margin: 0 0 14px; font-size: 15px; }
  .stats{ display:flex; gap: 22px; font-size: 13.5px; color: var(--text-soft); margin-bottom: 12px; }
  .stats b{ color: var(--text); font-weight: 600; }
  .tags{ display:flex; flex-wrap: wrap; gap: 8px; }
  .tag{
    font-size: 12.5px; padding: 5px 12px; border-radius: 100px;
    border: 1px solid var(--line); color: var(--text-soft); background: var(--surface);
  }

  /* ---------- Section head ---------- */
  .section-head{
    padding-top: 44px; border-top: 1px solid var(--line);
    display:flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 20px;
  }
  .section-head h2{ font-size: 24px; margin:0; }
  .section-head span{ font-size: 13px; color: var(--text-soft); }

  /* ---------- Grid (ins style) ---------- */
  .tilegrid{
    display:grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    padding-bottom: 60px;
  }
  .tile{
    position: relative; aspect-ratio: 1/1; border-radius: var(--r);
    overflow: hidden; display:block; text-decoration:none;
  }
  .tile .tilemood{
    position:absolute; left:14px; bottom:14px; color:#EEF3F8; font-size:22px;
  }
  .tile .tileinfo{
    position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end;
    padding:16px; color:#fff; opacity:0; transition: opacity .25s ease;
    background: linear-gradient(180deg, rgba(10,14,20,0) 44%, rgba(10,14,20,0.62));
  }
  .tile:hover .tileinfo{ opacity:1; }
  .tile .tileinfo b{ font-size:15px; font-weight:600; }
  .tile .tileinfo span{ font-size:12px; opacity:.85; }

  .t1{ background: linear-gradient(160deg,#1B2A3D,#3A5470); }
  .t2{ background: linear-gradient(160deg,#14181E,#2C3541); }
  .t3{ background: linear-gradient(160deg,#182A2E,#375861); }
  .t4{ background: linear-gradient(160deg,#1B1E36,#3A3F72); }
  .t5{ background: linear-gradient(160deg,#1D232C,#4A5768); }
  .t6{ background: linear-gradient(160deg,#0F2028,#22505F); }

  /* ---------- Footer ---------- */
  footer{
    padding: 40px 0 60px; border-top: 1px solid var(--line);
    display:flex; justify-content: space-between; align-items: flex-end;
    flex-wrap: wrap; gap: 24px;
  }
  footer .links{ display:flex; gap: 22px; font-size: 14px; }
  footer .links a{ display:inline-flex; align-items:center; gap:6px; text-decoration:none; color: var(--text-soft); transition: color .15s ease; }
  footer .links a:hover{ color: var(--text); }
  footer .links svg{ width:15px; height:15px; fill: currentColor; }
  footer .copy{ font-size: 13px; color: var(--text-soft); }

  #home.hidden{ display:none; }

  /* ---------- Detail (single game page) ---------- */
  .detail{ display:none; padding: 40px 0 60px; }
  .detail.active{ display:block; }
  .back{
    display:inline-flex; align-items:center; gap:6px; font-size:14px;
    color: var(--text-soft); text-decoration:none; margin-bottom: 26px;
  }
  .back:hover{ color: var(--text); }

  .cover{
    position: relative; border-radius: var(--r); overflow:hidden;
    aspect-ratio: 16/7; box-shadow: 0 26px 46px -30px rgba(16,20,27,0.45);
    margin-bottom: 32px;
  }
  .cover .dmeta{ position:absolute; left:28px; top:22px; font-size:12.5px; color:rgba(238,243,248,.8); }
  .cover .dtitle{ position:absolute; left:28px; bottom:22px; color:#EEF3F8; font-size:38px; }

  .entry{ padding: 26px 0; border-top: 1px solid var(--line); }
  .entry:first-of-type{ border-top:none; padding-top: 0; }
  .entry .edate{ font-size:13px; color: var(--text-soft); margin-bottom:10px; letter-spacing:.2px; }
  .entry p{ margin:0 0 16px; color: var(--text-soft); max-width: 62ch; font-size:15px; }
  .shots{ display:flex; gap:10px; flex-wrap:wrap; }
  .shot{
    width: 160px; aspect-ratio: 4/3; border-radius: 4px;
    background-color: var(--line); background-size: cover; background-position: center;
  }

  @media (max-width: 760px){
    .profile{ flex-direction:column; align-items:flex-start; text-align:left; padding-top:56px; }
    .tilegrid{ gap:4px; }
    .cover .dtitle{ font-size: 28px; }
    .shot{ width: 30%; }
  }

  @media (prefers-reduced-motion: reduce){
    * { transition: none !important; scroll-behavior: auto !important; }
  }
</style>

<script>
  // 纯前端切换首页/详情页，不修改地址栏 URL（不写 hash，不 pushState）
  function activate(id){
    var isHome = (id === 'home');
    document.getElementById('home').classList.toggle('hidden', !isHome);
    var details = document.querySelectorAll('.detail');
    for (var i = 0; i < details.length; i++) {
      details[i].classList.toggle('active', details[i].id === id);
    }
    window.scrollTo(0, 0);
  }
  function go(id, evt){
    if (evt) evt.preventDefault();
    activate(id);
  }
  function scrollToId(id, evt){
    if (evt) evt.preventDefault();
    var el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
</script>
