<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>留言后台 · YUU</title>
    <link rel="icon" type="image/png" href="images/system/favicon.png" />
    <style>
        :root {
            --bg: #EEF2F7; --surface: #FFFFFF; --text: #12151C; --text-soft: #626E7E;
            --line: rgba(16, 20, 27, 0.09); --accent: #32475F; --ice: #A9BED4; --r: 6px;
            --danger: #a8372f;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; background: var(--bg); color: var(--text);
            font: 16px/1.65 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        .wrap { max-width: 860px; margin: 0 auto; padding: 0 24px 80px; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; border-bottom: 1px solid var(--line); margin-bottom: 28px;
        }
        h1 { font: 500 22px 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif; margin: 0; }
        a { color: inherit; }
        .btn {
            background: var(--accent); color: #fff; border: 0; border-radius: var(--r);
            padding: 8px 18px; font: inherit; font-size: 14px; cursor: pointer; transition: background .2s;
        }
        .btn:hover { background: #1f3145; }
        .btn:disabled { opacity: .55; cursor: default; }
        .btn.ghost { background: transparent; color: var(--text-soft); border: 1px solid var(--line); }
        .btn.ghost:hover { background: var(--surface); color: var(--text); }
        .btn.danger { background: transparent; color: var(--danger); border: 1px solid rgba(168, 55, 47, .35); }
        .btn.danger:hover { background: rgba(168, 55, 47, .08); }
        .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 22px; }
        input[type=password], textarea {
            width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--r);
            background: var(--bg); font: inherit; font-size: 15px; outline: none;
        }
        input:focus, textarea:focus { border-color: var(--accent); }
        textarea { resize: vertical; }
        .login { max-width: 420px; margin: 80px auto; }
        .login p { color: var(--text-soft); font-size: 14px; margin: 0 0 14px; }
        .login .row { display: flex; gap: 10px; }
        .err { color: var(--danger); font-size: 14px; margin: 10px 0 0; }
        .err:empty { display: none; }

        .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
        .tab {
            border: 1px solid var(--line); background: var(--surface); color: var(--text-soft);
            border-radius: 100px; padding: 5px 14px; font: inherit; font-size: 13px; cursor: pointer;
        }
        .tab[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }

        .list { display: flex; flex-direction: column; gap: 12px; }
        .toolbar { display:flex; gap:10px; margin: 0 0 16px; flex-wrap:wrap; }
        .toolbar input { flex:1; min-width:220px; padding:9px 12px; border:1px solid var(--line); border-radius:var(--r); background:var(--surface); font:inherit; }
        .ipline { color:var(--text-soft); font-size:12px; margin: 4px 0 10px; overflow-wrap:anywhere; }
        .reply-state { color:var(--text-soft); font-size:12px; margin-top:5px; }
        .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
        .who { font-weight: 600; word-break: break-all; }
        .who small { font-weight: 400; color: var(--text-soft); margin-left: 8px; }
        .when { font-size: 12.5px; color: var(--text-soft); }
        .badge { font-size: 11.5px; padding: 1px 9px; border-radius: 100px; border: 1px solid var(--line); margin-left: 8px; color: var(--text-soft); background: var(--bg); }
        .badge.priv { color: #fff; background: var(--accent); border-color: var(--accent); }
        .badge.warn { color: var(--danger); border-color: rgba(168, 55, 47, .35); }
        .body { white-space: pre-wrap; word-break: break-word; margin: 0 0 10px; font-size: 15px; }
        .files { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .files button {
            font: inherit; font-size: 13px; color: var(--accent); background: var(--bg);
            border: 1px solid var(--line); border-radius: 4px; padding: 3px 10px; cursor: pointer;
        }
        .reply-box { margin-top: 6px; }
        .reply-box textarea { font-size: 14px; }
        .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .empty { color: var(--text-soft); text-align: center; padding: 40px 0; }
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--surface);
            border: 1px solid var(--accent); border-radius: var(--r); padding: 10px 22px; font-size: 14px;
            box-shadow: 0 8px 24px rgba(16,20,27,.15); display: none; z-index: 10;
        }
        .toast.show { display: block; }
        [hidden] { display: none !important; }
        @media (max-width: 480px) { .wrap { padding: 0 16px 60px; } .card { padding: 14px 16px; } }
    </style>
</head>
<body>
<div class="toast" id="toast" role="status"></div>
<div class="wrap">
    <div id="login" class="login card" hidden>
        <h1>留言后台</h1>
        <p>输入后台口令（部署 Worker 时设置的 ADMIN_TOKEN）。</p>
        <form id="loginForm" class="row">
            <input type="password" id="tokenInput" autocomplete="current-password" placeholder="口令" aria-label="后台口令" required />
            <button class="btn" type="submit">进入</button>
        </form>
        <p class="err" id="loginErr" role="alert"></p>
    </div>

    <div id="panel" hidden>
        <header>
            <h1>留言后台</h1>
            <div>
                <a class="btn ghost" href="index.html" style="text-decoration:none;display:inline-block">回到主页</a>
                <button class="btn ghost" id="logout" type="button">退出</button>
            </div>
        </header>
        <div class="tabs" id="tabs"></div>
        <div class="toolbar"><input id="searchInput" type="search" placeholder="搜索昵称、留言内容或 IP 地址" aria-label="搜索留言" /><button class="btn ghost" id="searchBtn" type="button">搜索</button><button class="btn ghost" id="resetSearch" type="button">清空</button></div>
        <div class="list" id="list"></div>
        <div style="text-align:center;margin-top:18px"><button class="btn ghost" id="more" type="button" hidden>加载更多</button></div>
    </div>
</div>
<script src="site-config.js"></script>
<script>
(function () {
    var API = ((window.SITE || {}).apiBase || '').replace(/\/+$/, '');
    var token = '';
    try { token = sessionStorage.getItem('yuu_admin') || ''; } catch (e) {}
    var filter = 'all', before = null, searchText = '';

    var $ = function (id) { return document.getElementById(id); };
    function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
    function toast(t) { var x = $('toast'); x.textContent = t; x.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { x.classList.remove('show'); }, 2500); }
    function fmt(ms) { var d = new Date(ms), p = function (n) { return String(n).padStart(2, '0'); }; return d.getFullYear() + '.' + p(d.getMonth() + 1) + '.' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds()); }
    function size(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; }

    function api(path, opts) {
        opts = opts || {};
        opts.headers = Object.assign({ Authorization: 'Bearer ' + token }, opts.headers || {});
        return fetch(API + path, opts).then(function (r) {
            if (r.status === 401) { var e = new Error('口令不正确'); e.auth = true; throw e; }
            return r;
        });
    }
    function jsonOrThrow(r) {
        return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) throw new Error(d.error || ('请求失败 ' + r.status)); return d; });
    }

    function showLogin(msg) {
        $('panel').hidden = true; $('login').hidden = false;
        $('loginErr').textContent = msg || '';
        $('tokenInput').focus();
    }
    function logout() { try { sessionStorage.removeItem('yuu_admin'); } catch (e) {} token = ''; showLogin(''); }

    var TABS = [['all', '全部'], ['private', '私密'], ['public', '公开'], ['pending', '待审核'], ['hidden', '已隐藏'], ['replied', '已回复'], ['unreplied', '未回复']];
    function renderTabs() {
        var box = $('tabs'); box.textContent = '';
        TABS.forEach(function (t) {
            var b = el('button', 'tab', t[1]); b.type = 'button';
            b.setAttribute('aria-pressed', String(filter === t[0]));
            b.onclick = function () { filter = t[0]; renderTabs(); load(false); };
            box.appendChild(b);
        });
    }

    function card(m) {
        var c = el('article', 'card');
        var head = el('div', 'head');
        var who = el('div', 'who', m.name);
        if (m.contact) {
            var small = el('small');
            if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m.contact)) { var a = el('a', null, m.contact); a.href = 'mailto:' + m.contact; small.appendChild(a); }
            else small.textContent = m.contact;
            who.appendChild(small);
        }
        var badges = el('span');
        badges.appendChild(el('span', 'badge' + (m.is_private ? ' priv' : ''), m.is_private ? '私密' : '公开'));
        if (!m.is_private && m.status === 'pending') badges.appendChild(el('span', 'badge warn', '待审核'));
        if (!m.is_private && m.status === 'hidden') badges.appendChild(el('span', 'badge warn', '已隐藏'));
        who.appendChild(badges);
        head.appendChild(who);
        head.appendChild(el('div', 'when', '#' + m.id + ' · ' + fmt(m.created_at)));
        c.appendChild(head);
        c.appendChild(el('p', 'body', m.content));
        c.appendChild(el('div', 'ipline', '访客 IP：' + (m.ip_address || '旧留言未记录 / 不可用')));

        if (m.attachments && m.attachments.length) {
            var files = el('div', 'files');
            m.attachments.forEach(function (f) {
                var b = el('button', null, '📎 ' + f.name + '（' + size(f.size) + '）'); b.type = 'button';
                b.onclick = function () { download(f); };
                files.appendChild(b);
            });
            c.appendChild(files);
        }

        var rb = el('div', 'reply-box');
        var ta = el('textarea'); ta.rows = 2; ta.maxLength = 2000; ta.value = m.reply || '';
        ta.placeholder = m.is_private ? '私密留言的回复不会显示在网站上，请直接发邮件回复。这里可作笔记。' : '公开回复会显示在这条留言下面';
        var replyState = el('div', 'reply-state', m.reply ? ('当前状态：已回复' + (m.reply_edited_at ? ' · 曾修改于 ' + fmt(m.reply_edited_at) : '')) : '当前状态：尚未回复');
        ta.setAttribute('aria-label', '回复');
        rb.appendChild(ta); rb.appendChild(replyState); c.appendChild(rb);

        var act = el('div', 'actions');
        var save = el('button', 'btn', m.reply ? '保存修改' : '保存回复'); save.type = 'button';
        save.onclick = function () { patch(m.id, { reply: ta.value }, save, '已保存').then(function (ok) { if (ok) load(false); }); };
        act.appendChild(save);
        if (m.reply) { var clearReply = el('button', 'btn ghost', '删除回复'); clearReply.type = 'button'; clearReply.onclick = function () { if (!confirm('确定清空这条管理员回复吗？')) return; patch(m.id, { reply: '' }, clearReply, '回复已删除').then(function (ok) { if (ok) load(false); }); }; act.appendChild(clearReply); }
        if (!m.is_private) {
            var vis = m.status === 'visible';
            var tg = el('button', 'btn ghost', vis ? '隐藏' : (m.status === 'pending' ? '通过并显示' : '恢复显示')); tg.type = 'button';
            tg.onclick = function () { patch(m.id, { status: vis ? 'hidden' : 'visible' }, tg, '已更新').then(function () { load(false); }); };
            act.appendChild(tg);
        }
        var del = el('button', 'btn danger', '删除'); del.type = 'button';
        del.onclick = function () {
            if (!confirm('确定删除这条留言' + (m.attachments && m.attachments.length ? '和它的附件' : '') + '吗？不能恢复。')) return;
            del.disabled = true;
            api('/api/admin/messages/' + m.id, { method: 'DELETE' }).then(jsonOrThrow)
                .then(function () { c.remove(); toast('已删除'); })
                .catch(function (e) { del.disabled = false; handle(e); });
        };
        act.appendChild(del);
        c.appendChild(act);
        return c;
    }

    function patch(id, body, btn, okMsg) {
        btn.disabled = true;
        return api('/api/admin/messages/' + id, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
            .then(jsonOrThrow).then(function () { toast(okMsg); return true; })
            .catch(function (e) { handle(e); return false; }).then(function (ok) { btn.disabled = false; return ok; });
    }

    function download(f) {
        api('/api/admin/file?key=' + encodeURIComponent(f.key))
            .then(function (r) { if (!r.ok) throw new Error('下载失败 ' + r.status); return r.blob(); })
            .then(function (blob) {
                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob); a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
                setTimeout(function () { URL.revokeObjectURL(a.href); }, 10000);
            }).catch(handle);
    }

    function handle(e) { if (e && e.auth) { logout(); showLogin('口令不正确或已失效，请重新输入。'); } else toast((e && e.message) || '出错了'); }

    function load(append) {
        var list = $('list'), more = $('more');
        if (!append) { list.textContent = ''; before = null; }
        var q = '/api/admin/messages?filter=' + filter + (append && before ? '&before=' + before : '');
        return api(q).then(jsonOrThrow).then(function (d) {
            $('login').hidden = true; $('panel').hidden = false;
            try { sessionStorage.setItem('yuu_admin', token); } catch (e) {}
            d.messages.forEach(function (m) { list.appendChild(card(m)); });
            if (d.messages.length) before = d.messages[d.messages.length - 1].id;
            if (!append && !d.messages.length) list.appendChild(el('p', 'empty', '这里还没有留言。'));
            more.hidden = !d.hasMore;
        }).catch(function (e) {
            if (e.auth) { token = ''; showLogin('口令不正确。'); } else { $('panel').hidden = false; toast(e.message === 'Failed to fetch' ? '连不上后端，请检查 site-config.js 里的 apiBase' : e.message); }
        });
    }

    $('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        token = $('tokenInput').value.trim();
        $('tokenInput').value = '';
        if (token) load(false);
    });
    $('logout').onclick = logout;
    $('more').onclick = function () { load(true); };
    $('searchBtn').onclick = function () { searchText = $('searchInput').value.trim(); load(false); };
    $('searchInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') { searchText = this.value.trim(); load(false); } });
    $('resetSearch').onclick = function () { $('searchInput').value = ''; searchText = ''; load(false); };

    renderTabs();
    if (!API) { showLogin('还没有配置后端地址：请先在 site-config.js 里填写 apiBase。'); }
    else if (token) load(false);
    else showLogin('');
})();
</script>
</body>
</html>
